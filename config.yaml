symbol: ETHUSDT
exchange: binance

# Default history size for timeframes not explicitly listed below.
historical_candles: 30000

# Use realistic history sizes for each timeframe.
# Small timeframes get more bars; large timeframes get fewer bars because
# the available ETHUSDT history is naturally shorter.
historical_candles_by_timeframe:
  1m: 30000
  3m: 30000
  5m: 30000
  15m: 30000
  30m: 30000
  1h: 30000
  4h: 10000
  1d: 3000

database: data/eth_market.db

timeframes:
  - 1m
  - 3m
  - 5m
  - 15m
  - 30m
  - 1h
  - 4h
  - 1d

pattern:
  lookbacks: [3, 5, 8, 10, 15, 20, 30, 50]
  minimum_similarity: 0.85
  top_k: 10

turning_points:
  method: zigzag
  thresholds_pct: [0.10, 0.25, 0.50, 1.00, 2.00, 5.00]

outcomes:
  horizons: [5, 10, 20, 50]
  target_pct: 1.0
  stop_pct: 0.5

statistics:
  confidence_level: 0.95

live:
  websocket_base: wss://stream.binance.com:9443/ws
  reconnect_seconds: 5
