symbol: ETHUSDT
exchange: binance
historical_days: 365
database: data/eth_market.db

# Binance kline intervals supported by this project
timeframes:
  - 1m
  - 3m
  - 5m
  - 15m
  - 30m
  - 1h
  - 4h
  - 1d

pattern:
  lookbacks: [3, 5, 8, 10, 15, 20, 30, 50]
  minimum_similarity: 0.85
  top_k: 10

turning_points:
  method: zigzag
  thresholds_pct: [0.10, 0.25, 0.50, 1.00, 2.00, 5.00]

outcomes:
  horizons: [5, 10, 20, 50]
  target_pct: 1.0
  stop_pct: 0.5

statistics:
  confidence_level: 0.95

live:
  websocket_base: wss://stream.binance.com:9443/ws
  reconnect_seconds: 5
